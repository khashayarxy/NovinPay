<script>try{const path=new URL('support-client/theme-init.js',document.baseURI).pathname,installation=localStorage.getItem('support-theme-installation:'+path+':customer-v2');const mode=installation?(localStorage.getItem('support-theme:'+installation+':customer')||localStorage.getItem('support-theme:'+installation+':customer-v2')):null;document.documentElement.dataset.supportTheme=['light','dark'].includes(mode)?mode:'light';}catch{document.documentElement.dataset.supportTheme='light';}</script>
